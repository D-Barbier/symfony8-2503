<VirtualHost *:80>
        ServerName localhost
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html/public

        # Appliquer ces directives au dossier public du site
    <Directory /var/www/html/public>

        # liens symboliques dans ce dossier
        Options +FollowSymlinks
        AllowOverride All
        # Autorise l'accès à tout le monde
        Require all granted
        # Ressource de secours : si aucune ressource ne correspond, on renvoie index.php
        FallbackResource /index.php
        # réécriture d'URL ON
        RewriteEngine On

        # Condition 1 : PAS un fichier 
        RewriteCond %{REQUEST_FILENAME} !-f
        # Condition 2 :  PAS un dossier 
        RewriteCond %{REQUEST_FILENAME} !-d
        # Condition 3 : PAS un favicon.ico 
        RewriteCond %{REQUEST_FILENAME} !-favicon.ico$
        RewriteRule ^(.*)$ /index.php/$1 [L,QSA]
        # [L]  arrête le traitement des règles si celle-ci matche
        # [QSA]: 

    </Directory>


        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>